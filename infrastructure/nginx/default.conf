# Nginx — reverse proxy pentru backend Symfony (php-fpm).
# În producție se adaugă blocul TLS (443) cu HSTS; aici doar dev.

server {
    listen 80;
    server_name _;
    root /var/www/app/public;

    # DNS-ul intern al Docker. Necesar pentru că `fastcgi_pass` de mai jos
    # folosește o VARIABILĂ, nu un nume literal — vezi comentariul de acolo.
    # `valid=10s` limitează cât timp păstrăm o adresă rezolvată.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Security headers (dublate/consolidate în producție prin TLS + HSTS)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    client_max_body_size 20m;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        # ATENȚIE — nu reveniți la `fastcgi_pass backend:9000;`.
        #
        # Cu un nume LITERAL, nginx rezolvă `backend` O SINGURĂ DATĂ, la pornire,
        # și păstrează adresa cât trăiește procesul. La orice deploy care
        # RECREEAZĂ containerul backend, acesta primește un IP nou, iar nginx
        # continuă să sune la cel vechi: „connect() failed (111: Connection
        # refused) ... upstream: fastcgi://172.18.0.4:9000". Rezultatul e 502 pe
        # tot /api, cu backend-ul perfect sănătos — și rămâne așa până când
        # cineva repornește manual containerul `api`. S-a întâmplat în producție
        # pe 2026-08-11.
        #
        # Puse într-o variabilă, nginx re-rezolvă numele la runtime (folosind
        # `resolver` de mai sus), deci un backend recreat e găsit în ~10s fără
        # restart. Asta face deploy-urile automate sigure.
        set $bcss_backend backend:9000;
        fastcgi_pass $bcss_backend;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param DOCUMENT_ROOT $document_root;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
