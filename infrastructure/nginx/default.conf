# Nginx — reverse proxy in front of the Symfony backend (php-fpm).
#
# TLS is terminated by Caddy at the edge, not here; this server block only
# listens on plain HTTP inside the Docker network.

server {
    listen 80;
    server_name _;
    root /var/www/app/public;

    # Docker's internal DNS. Required because the `fastcgi_pass` below uses a
    # VARIABLE rather than a literal name — see the comment there. `valid=10s`
    # caps how long a resolved address is cached.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Security headers (complemented at the edge by Caddy's TLS + HSTS)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    client_max_body_size 20m;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        # WARNING — do not go back to `fastcgi_pass backend:9000;`.
        #
        # With a LITERAL name, nginx resolves `backend` ONCE, at start-up, and
        # keeps that address for the life of the worker process. Any deploy that
        # RECREATES the backend container gives it a new IP, and nginx keeps
        # dialling the old one: "connect() failed (111: Connection refused) ...
        # upstream: fastcgi://172.18.0.4:9000". The result is 502 across all of
        # /api while the backend is perfectly healthy — and it stays that way
        # until someone restarts the `api` container by hand. This happened in
        # production on 2026-08-11.
        #
        # Placed in a variable, nginx re-resolves the name at request time
        # (using the `resolver` above), so a recreated backend is found within
        # ~10s without a restart. That is what makes automated deploys safe.
        set $bcss_backend backend:9000;
        fastcgi_pass $bcss_backend;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param DOCUMENT_ROOT $document_root;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
