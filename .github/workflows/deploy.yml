name: Deploy (production)

# A push to `main` builds the four images on GitHub runners, publishes them to
# GHCR tagged with the commit SHA, then SSHes to the server to take a backup,
# pull the images and restart.
#
# Images are NEVER built on the production machine: two Next.js compiles plus
# the PHP extension build peg both vCPUs for ~15 minutes, on the same machine
# that serves the pilot.
on:
  push:
    branches: [ "main" ]
  # Allows re-running a deploy manually (or deploying a specific commit).
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit/branch to deploy (default: main)"
        required: false
        default: "main"

concurrency:
  group: deploy-production
  # Do NOT cancel a deploy in flight: interrupted between `migrate` and `up -d`
  # it would leave the stack half migrated.
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  # --------------------------------------------------------------------------
  # The gate. `backend-ci.yml` has path filters, so it does NOT run on every
  # push to main — a deploy cannot rely on it. The frontends are covered
  # implicitly: `next build` runs inside the image, so a broken frontend stops
  # the build.
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pdo_sqlite, intl, ctype, iconv, mbstring
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        working-directory: backend
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Container lint (prod + test)
        working-directory: backend
        env:
          APP_SECRET: ci-lint
          CLAMAV_HOST: clamav
          CLAMAV_PORT: "3310"
          DATABASE_URL: "postgresql://u:p@db:5432/d?serverVersion=16&charset=utf8"
          MESSENGER_TRANSPORT_DSN: "doctrine://default?auto_setup=0"
          STORAGE_DRIVER: s3
          S3_ENDPOINT: http://minio:9000
          S3_BUCKET: b
          S3_KEY: k
          S3_SECRET: s
          S3_REGION: eu-central-1
          CORS_ALLOW_ORIGIN: https://app.bcss.ro
          APP_TIMEZONE: Europe/Bucharest
        run: |
          php bin/console lint:container --env=prod
          php bin/console lint:container --env=test
          php bin/console lint:yaml config --parse-tags

      - name: PHPUnit
        working-directory: backend
        env:
          APP_ENV: test
        run: |
          php bin/console doctrine:schema:create --env=test
          vendor/bin/phpunit

  # --------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.name }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          # `worker`, `migrate` and `scheduler` reuse the backend image.
          - name: backend
            context: ./backend
            file: infrastructure/docker/backend.Dockerfile
          - name: customer-web
            context: ./apps/customer-web
            file: infrastructure/docker/frontend.Dockerfile
          - name: service-admin
            context: ./apps/service-admin
            file: infrastructure/docker/frontend.Dockerfile
          - name: backup
            context: ./infrastructure/backup
            file: infrastructure/backup/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ALL four are rebuilt every time, even when only one changed. Otherwise
      # the current SHA tag would not exist for the unchanged services and
      # `docker compose pull` would fail on the server. GHA layer caching keeps
      # the unchanged builds cheap.
      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/bcsc-${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/bcsc-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # --------------------------------------------------------------------------
  deploy:
    name: Deploy to the server
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The host fingerprint comes from a secret, NOT from an `ssh-keyscan`
          # at deploy time: accepting whatever key is presented at that moment
          # defeats the point of host verification.
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # The script is COPIED and run as a FILE. The variant
      #   ssh … 'bash -s' < scripts/deploy-remote.sh
      # was a silent disaster: `docker compose run` inside the script reads
      # stdin — which was the rest of the script — so bash hit EOF and exited 0
      # after step 2. The pull/up/verify steps never ran and the workflow
      # reported success with production untouched.
      - name: Copy the deploy script
        run: |
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
              scripts/deploy-remote.sh \
              "${{ secrets.DEPLOY_USER || 'ubuntu' }}@${{ secrets.DEPLOY_HOST }}:/tmp/bcss-deploy.sh"

      - name: Deploy
        # `-n`: ssh reads no stdin at all. The script is a file on the server, so
        # stdin stays free for the commands inside it.
        run: |
          ssh -n -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
              "${{ secrets.DEPLOY_USER || 'ubuntu' }}@${{ secrets.DEPLOY_HOST }}" \
              "IMAGE_TAG='${{ github.sha }}' bash /tmp/bcss-deploy.sh; rc=\$?; rm -f /tmp/bcss-deploy.sh; exit \$rc"

      - name: Clean up keys
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts
