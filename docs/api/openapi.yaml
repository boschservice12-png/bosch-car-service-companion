openapi: 3.1.0
info:
  title: Bosch Car Service Companion API
  version: 1.0.0
  description: >
    REST API for the customer application (PWA) and the workshop portal
    (single-tenant). All user-facing messages are in Romanian; the applications
    translate them client-side into Hungarian and English. Errors use the
    application/problem+json. Autentificarea este pe sesiune (cookie httpOnly).
    Every state-changing request (POST/PATCH/DELETE) requires the CSRF pair
    „double submit": cookie-ul `bcsc_csrf` (emis de GET /csrf) + antetul
    `X-CSRF-Token` carrying the same value. This document is kept in sync with
    the real router by OpenApiSyncTest, in both directions.
servers:
  - url: https://localhost/api
    description: Local (Nginx + HTTPS)
tags:
  - { name: System }
  - { name: Auth }
  - { name: Auth2FA, description: "P0-06 — al doilea factor (TOTP), doar conturi de service" }
  - { name: Me }
  - { name: Vehicles }
  - { name: Deadlines, description: "Deadlines: roadworthiness test / insurance / road tax / roadside assistance" }
  - { name: ServiceRecords, description: "Istoric service (carnet digital)" }
  - { name: Import, description: "Excel/CSV import from the workshop records (ASM)" }
  - { name: Conversations, description: "Messages and requests between customer and workshop" }
  - { name: QuoteRequests, description: "Quote requests (specification point 7)" }
  - { name: RoadsideRequests }
  - { name: MobilityRequests }
  - { name: DamageClaims, description: "Doar administrare — clientul deschide dosarul EXCLUSIV pe amiabila.com" }
  - { name: Taxes, description: "Vehicle taxes and duties — declarative records, NO document upload" }
  - { name: Documents }
  - { name: Settings }

paths:
  # ---------------------------------------------------------------- System
  /health:
    get:
      tags: [System]
      summary: Liveness
      security: []
      responses:
        '200': { description: OK }
  /health/ready:
    get:
      tags: [System]
      summary: Deep readiness (database, migrations, storage, secrets, messenger, scanner)
      description: >
        Separate from liveness. Checks the critical dependencies (database,
        migration state, storage write/read, application secrets) plus messenger
        and scanner, which are non-critical. A failed critical dependency returns
        503; readiness is never green with a default secret or unapplied
        migrations. The response contains {status, ready, checks{...}}, with no
        secrets or connection strings.
      security: []
      responses:
        '200': { description: 'Ready (all critical dependencies ok)' }
        '503': { $ref: '#/components/responses/Error' }
  /csrf:
    get:
      tags: [System]
      summary: Emite cookie-ul CSRF `bcsc_csrf` (P0-05, double submit)
      description: >
        The frontend calls this at start-up and after logout. The cookie value
        is sent back in the X-CSRF-Token header on every request
        modificatoare; nepotrivirea → 403.
      security: []
      responses:
        '200': { description: Cookie emis (Set-Cookie bcsc_csrf) }

  # ------------------------------------------------------------------ Auth
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Authenticate with email + password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: >
            Autentificat. Pentru un admin cu 2FA activ, `requiresOtp=true` —
            the session stays locked until POST /auth/2fa/verify.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { description: CSRF token missing or mismatched }
        '429': { description: Too many attempts (login throttling) }
  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Customer registration (email + password + consent)
      description: >
        Product decision P1-02: if the email belongs to an account created by
        the Excel import (which has no password), registration CLAIMS that
        account — mandatorily with a `plateNumber` matching a vehicle in the
        records — and the customer immediately sees their vehicles and history.
        An account that already
        activat nu poate fi suprascris (422).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { description: Cont creat sau cont importat revendicat }
        '403': { description: CSRF token missing or mismatched }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out (clears the session and the CSRF cookie)
      responses:
        '204': { description: Deconectat }

  # ------------------------------------------------------------- Auth 2FA
  /auth/2fa/setup:
    post:
      tags: [Auth2FA]
      summary: Begin 2FA enrolment (requires RE-entering the password)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        '200':
          description: Secret issued (pending — active only after /enable)
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string, description: "Base32, 160 bits" }
                  otpauthUri: { type: string, description: "Pentru codul QR" }
        '403': { description: Nu e cont de service }
        '409': { description: 2FA deja activ }
        '422': { description: Incorrect password }
  /auth/2fa/enable:
    post:
      tags: [Auth2FA]
      summary: Confirm enrolment with a valid TOTP code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: "6 cifre" }
      responses:
        '200':
          description: >
            2FA is active. The backup codes appear ONCE, in this response;
            only hashes are stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  twoFactorEnabled: { type: boolean }
                  recoveryCodes:
                    type: array
                    items: { type: string, example: "A2C4-EF68" }
        '409': { description: No pending enrolment }
        '422': { description: Cod invalid }
  /auth/2fa/verify:
    post:
      tags: [Auth2FA]
      summary: Unlock the session after login (TOTP code or backup code)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, description: "Cod TOTP (6 cifre)" }
                recoveryCode: { type: string, description: "Single-use backup code" }
      responses:
        '200': { description: Session verified }
        '422': { description: Cod invalid }
  /auth/2fa/disable:
    post:
      tags: [Auth2FA]
      summary: Disable 2FA (requires a valid TOTP code)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200': { description: 2FA dezactivat }
        '422': { description: Cod invalid }

  # -------------------------------------------------------------------- Me
  /me:
    get:
      tags: [Me]
      summary: Utilizatorul curent
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Error' }
  /me/export:
    get:
      tags: [Me]
      summary: 'P1-06 — GDPR export: all the customer''s data as downloadable JSON'
      responses:
        '200': { description: 'JSON with account, vehicles, deadlines, history, taxes, conversations, requests' }
        '403': { description: Doar conturi de client }
  /me/delete:
    post:
      tags: [Me]
      summary: 'P1-06 — GDPR erasure request (requires re-entering the password)'
      description: >
        The account is blocked immediately and the session is closed. After the
        grace period (30 days by default, `app:gdpr:purge`) the identity is
        irreversibly anonymised; during the grace period an operator can cancel
        the request
        (`app:gdpr:cancel-deletion`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        '200': { description: Request recorded; the account is blocked }
        '403': { description: Doar conturi de client }
        '422': { description: Incorrect password }

  # -------------------------------------------------------------- Vehicles
  /vehicles:
    get:
      tags: [Vehicles]
      summary: Vehiculele proprii (doar ale clientului autentificat)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Vehicle' } } } } }
    post:
      tags: [Vehicles]
      summary: Add one of your own vehicles
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleInput' }
      responses:
        '201': { description: Creat }
        '409': { description: VIN activ duplicat (P0-02) }
        '422': { $ref: '#/components/responses/ValidationError' }
  /vehicles/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Vehicles]
      summary: Detaliile unui vehicul propriu
      responses:
        '200': { description: OK }
        '403': { description: Vehiculul altui client }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Vehicles]
      summary: Update the vehicle (plate, make, model, year)
      responses:
        '200': { description: OK }
        '403': { description: Vehiculul altui client }
        '422': { $ref: '#/components/responses/ValidationError' }
  /vehicles/{id}/deadlines:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Deadlines]
      summary: The vehicle's deadlines
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Deadline' } } } } }
    post:
      tags: [Deadlines]
      summary: Add a deadline (customer or admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeadlineInput' }
      responses:
        '201': { description: Created }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ------------------------------------------------------------- Deadlines
  /deadlines/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    patch:
      tags: [Deadlines]
      summary: Update or verify a deadline
      description: >
        An admin can send `verify: true` ("verified by the workshop"). A CLIENT
        editing the dates resets that verification (the source becomes CLIENT
        again) — the trust badge does not survive customer changes.
      responses:
        '200': { description: OK }
        '403': { description: No permission on this vehicle }
        '422': { $ref: '#/components/responses/ValidationError' }
  /deadlines/{id}/documents:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [Deadlines]
      summary: Attach an uploaded document to a deadline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentId]
              properties:
                documentId: { type: string, format: uuid }
      responses:
        '200': { description: Attached }
        '404': { description: Document inexistent sau nescanat }
  /deadlines/{id}/documents/{docId}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { $ref: '#/components/parameters/DocId' }
    get:
      tags: [Deadlines]
      summary: Download the deadline's document (P0-04 — authorised per vehicle)
      responses:
        '200': { description: 'File content (private, no-store)' }
        '403': { description: Vehiculul altui client }
        '404': { description: 'The document does not belong to the deadline, or is not servable' }

  # ------------------------------------- Deadline notifications (P1-03, admin)
  /admin/deadlines/upcoming:
    get:
      tags: [Deadlines]
      summary: (admin) Deadlines expiring within ?days days, with the owner's contact details
      description: >
        Product decision P1-03: notifications go out from the workshop's OWN
        WhatsApp (no paid API) and by email — the portal composes the message
        (wa.me / mailto) and the operator sends it. Already-expired deadlines are
        included; `lastNotifiedAt` is the last manual notification recorded.
      parameters:
        - { name: days, in: query, required: false, schema: { type: integer, default: 30, minimum: 1, maximum: 365 } }
      responses:
        '200': { description: 'List with vehicle, owner (name/phone/email), days remaining' }
        '403': { description: Doar service }
  /admin/deadlines/{id}/notifications:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [Deadlines]
      summary: (admin) Record a manually sent notification (whatsapp / email)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                channel: { type: string, enum: [whatsapp, email] }
      responses:
        '200': { description: Recorded (idempotent for the same threshold + channel) }
        '404': { $ref: '#/components/responses/Error' }
        '422': { description: Canal necunoscut }

  /admin/notifications:
    get:
      tags: [Notifications]
      summary: (admin) Recent notifications with their real delivery state
      description: >
        States: PENDING, PROCESSING, MANUAL_ACTION_REQUIRED, SENT, FAILED,
        SKIPPED. With no automated provider (the pilot), notifications end up
        MANUAL_ACTION_REQUIRED or SKIPPED — never a blind SENT.
      responses:
        '200': { description: OK }
  /admin/notifications/{id}/manually-sent:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [Notifications]
      summary: (admin) Confirm a MANUAL send → SENT (audited)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                channel: { type: string, example: whatsapp }
                note: { type: string }
      responses:
        '200': { description: 'Marked SENT (manual, with sentBy/sentAt)' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { description: Channel missing }

  # ------------------------------------------------- Istoric service (client)
  /vehicles/{vehicleId}/service-records:
    parameters: [ { $ref: '#/components/parameters/VehicleId' } ]
    get:
      tags: [ServiceRecords]
      summary: Istoricul PUBLICAT al vehiculului propriu
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ServiceRecord' } } } } }
        '403': { description: Vehiculul altui client }
  /vehicles/{vehicleId}/service-records/pdf:
    parameters: [ { $ref: '#/components/parameters/VehicleId' } ]
    get:
      tags: [ServiceRecords]
      summary: Carnetul de service al vehiculului, ca PDF
      responses:
        '200': { description: PDF }
        '403': { description: Vehiculul altui client }
  /service-records/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [ServiceRecords]
      summary: A single service-history entry (published)
      responses:
        '200': { description: OK }
        '403': { description: Vehiculul altui client }
        '404': { $ref: '#/components/responses/Error' }
  /service-records/{id}/pdf:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [ServiceRecords]
      summary: A service-history entry as a PDF
      responses:
        '200': { description: PDF }
        '403': { description: Vehiculul altui client }
  /service-records/{recordId}/documents/{docId}:
    parameters:
      - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
      - { $ref: '#/components/parameters/DocId' }
    get:
      tags: [ServiceRecords]
      summary: Download a document attached to a history entry
      responses:
        '200': { description: File content }
        '403': { description: Vehiculul altui client }
        '404': { $ref: '#/components/responses/Error' }

  # -------------------------------------------------- Istoric service (admin)
  /admin/vehicles:
    get:
      tags: [ServiceRecords]
      summary: (admin) Toate vehiculele, cu proprietar — panoul principal
      responses:
        '200': { description: OK }
        '403': { description: Doar service }
  /admin/vehicles/{id}/activation-token:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [Vehicles]
      summary: (admin) Emite un cod de activare pentru vehicul
      description: >
        The code is returned in CLEAR exactly ONCE; only its SHA-256 hash is
        stored. A registration plate or VIN does NOT grant access — only this
        code does. Issuing one revokes the vehicle's still-valid codes.
      responses:
        '201': { description: 'Code issued (returned once)' }
        '404': { $ref: '#/components/responses/Error' }
  /admin/vehicles/{id}/activation-token/revoke:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [Vehicles]
      summary: (admin) Revoke the vehicle's valid activation codes
      responses:
        '200': { description: 'The number of codes revoked' }
        '404': { $ref: '#/components/responses/Error' }
  /me/vehicles/activate:
    post:
      tags: [Vehicles]
      summary: Activate a vehicle with a code issued by the workshop
      description: >
        The customer becomes the active owner, replacing any previous owner
        anterior). Cod invalid/expirat/folosit/revocat → 422 generic. Limitat
        rate limited (per user + IP).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200': { description: Vehicul activat }
        '422': { description: Cod invalid sau expirat }
        '429': { description: Too many attempts }
  /admin/vehicles/{vehicleId}/service-records:
    parameters: [ { $ref: '#/components/parameters/VehicleId' } ]
    get:
      tags: [ServiceRecords]
      summary: (admin) Istoricul complet (inclusiv ciorne) al unui vehicul
      responses:
        '200': { description: OK }
    post:
      tags: [ServiceRecords]
      summary: (admin) Create a history entry (draft)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceRecordInput' }
      responses:
        '201': { description: Created }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/service-records/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [ServiceRecords]
      summary: (admin) O intrare de istoric
      responses:
        '200': { description: OK }
    patch:
      tags: [ServiceRecords]
      summary: (admin) Edit an entry (drafts only)
      responses:
        '200': { description: OK }
        '422': { description: A published entry cannot be edited directly }
  /admin/service-records/{id}/publish:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [ServiceRecords]
      summary: (admin) Publish the entry — it becomes visible to the customer
      responses:
        '200': { description: Published }
        '422': { description: Already published }
  /admin/service-records/{id}/corrections:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [ServiceRecords]
      summary: (admin) Correct a published entry (with a reason, state CORRECTED)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200': { description: Correction opened }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/service-records/{id}/documents:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [ServiceRecords]
      summary: (admin) Attach a document (estimate, invoice) to an entry
      responses:
        '200': { description: Attached }
        '404': { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- Import
  /admin/import/clients:
    post:
      tags: [Import]
      summary: (admin) Import customers + vehicles from Excel/CSV
      description: >
        Multipart, field `file` (.xlsx or .csv). Columns: owner, registration
        plate, VIN (optionally make, model, phone, email). A single transaction;
        conflicts (a VIN belonging to another owner, an admin email) are reported
        per row without changing anything. Created accounts have no password —
        the customer claims them at registration (email + plate).
      responses:
        '200': { description: 'Import report (rows, created, per-row errors)' }
        '403': { description: Doar service }
        '422': { description: File missing or header incomplete }
  /admin/import/deadlines:
    post:
      tags: [Import]
      summary: '(admin) Step 3: the ASM roadworthiness/insurance alert report → deadlines'
      description: >
        Multipart, field `file` (.xls/.xlsx/.csv — ASM exports arrive as binary
        .xls). Columns: alert name, alert date (an Excel serial number or a
        date), registration plate. Only roadworthiness, insurance and road-tax
        alerts become deadlines; the vehicle is identified by plate; re-importing
        updates or skips idempotently.
      responses:
        '200': { description: 'Report (created, updated, skipped, per-row errors)' }
        '403': { description: Doar service }
        '422': { description: File missing or header incomplete }
  /admin/import/service-history:
    post:
      tags: [Import]
      summary: (admin) Import repair history (linked to vehicles by VIN)
      description: >
        Multipart, field `file`. Deduplicated by work-order number or by content
        (date + total + type + description), including within the same file;
        re-importing is idempotent. Entries are published directly.
      responses:
        '200': { description: Raport de import }
        '403': { description: Doar service }
        '422': { description: File missing or header incomplete }

  # --------------------------------------------------------- Conversations
  /conversations:
    get:
      tags: [Conversations]
      summary: Your own conversations
      responses:
        '200': { description: OK }
    post:
      tags: [Conversations]
      summary: Start a conversation (subject + message, optionally vehicle/documents)
      responses:
        '201': { description: Created }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: 'Message rate limit (P1-04, Retry-After)' }
  /conversations/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Conversations]
      summary: One of your conversations, with its messages
      responses:
        '200': { description: OK }
        '403': { description: Another customer's conversation }
  /conversations/{id}/messages:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Conversations]
      summary: The conversation's messages
      responses:
        '200': { description: OK }
    post:
      tags: [Conversations]
      summary: Send a message in the conversation
      responses:
        '201': { description: Trimis }
        '422': { description: 'Conversation closed, or empty message' }
        '429': { description: 'Message rate limit (P1-04, Retry-After)' }
  /conversations/{id}/documents/{docId}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { $ref: '#/components/parameters/DocId' }
    get:
      tags: [Conversations]
      summary: Download an attachment from the conversation
      responses:
        '200': { description: File content }
        '403': { description: Another customer's conversation }
        '404': { $ref: '#/components/responses/Error' }
  /admin/conversations:
    get:
      tags: [Conversations]
      summary: (admin) All conversations
      responses:
        '200': { description: OK }
  /admin/conversations/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Conversations]
      summary: (admin) A single conversation
      responses:
        '200': { description: OK }
  /admin/conversations/{id}/messages:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [Conversations]
      summary: (admin) Reply in the conversation
      responses:
        '201': { description: Trimis }
        '429': { description: 'Message rate limit (P1-04, Retry-After)' }
  /admin/conversations/{id}/close:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [Conversations]
      summary: (admin) Close the conversation
      responses:
        '200': { description: Closed }
  /admin/conversations/{id}/reopen:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [Conversations]
      summary: (admin) Reopen the conversation
      responses:
        '200': { description: Reopened }

  # --------------------------------------------------------- QuoteRequests
  /quote-requests:
    get:
      tags: [QuoteRequests]
      summary: Your own quote requests
      responses:
        '200': { description: OK }
    post:
      tags: [QuoteRequests]
      summary: Create a quote request (draft, or submitted directly)
      responses:
        '201': { description: Created }
        '422': { $ref: '#/components/responses/ValidationError' }
  /quote-requests/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [QuoteRequests]
      summary: One of your quote requests
      responses:
        '200': { description: OK }
        '403': { description: Cererea altui client }
  /quote-requests/{id}/submit:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [QuoteRequests]
      summary: Submit the draft to the workshop
      responses:
        '200': { description: Submitted }
        '409': { description: State transition not permitted }
  /quote-requests/{id}/resubmit:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [QuoteRequests]
      summary: Resubmit after supplying the requested information
      responses:
        '200': { description: Resubmitted }
        '409': { description: State transition not permitted }
  /quote-requests/{id}/accept:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [QuoteRequests]
      summary: Accept the quote received
      responses:
        '200': { description: Accepted }
        '409': { description: State transition not permitted }
  /quote-requests/{id}/decline:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [QuoteRequests]
      summary: Decline the quote received
      responses:
        '200': { description: Declined }
        '409': { description: State transition not permitted }
  /admin/quote-requests:
    get:
      tags: [QuoteRequests]
      summary: (admin) All quote requests
      responses:
        '200': { description: OK }
  /admin/quote-requests/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [QuoteRequests]
      summary: (admin) A single quote request
      responses:
        '200': { description: OK }
  /admin/quote-requests/{id}/response:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [QuoteRequests]
      summary: (admin) Send the quote (message + optional document)
      responses:
        '200': { description: Quote sent }
        '409': { description: State transition not permitted }
  /admin/quote-requests/{id}/status:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    patch:
      tags: [QuoteRequests]
      summary: (admin) Change the state (taken, in review, information requested…)
      responses:
        '200': { description: OK }
        '409': { description: State transition not permitted }

  # ------------------------------------------------------ RoadsideRequests
  /roadside-requests:
    get:
      tags: [RoadsideRequests]
      summary: Your own roadside assistance requests
      responses:
        '200': { description: OK }
    post:
      tags: [RoadsideRequests]
      summary: A written assistance request (location, problem, phone — NO files)
      responses:
        '201': { description: Created }
        '422': { $ref: '#/components/responses/ValidationError' }
  /roadside-requests/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [RoadsideRequests]
      summary: O cerere proprie
      responses:
        '200': { description: OK }
        '403': { description: Cererea altui client }
  /roadside-requests/{id}/cancel:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [RoadsideRequests]
      summary: Cancel the request (while it is not yet completed)
      responses:
        '200': { description: Cancelled }
        '409': { description: Terminal state }
  /roadside-requests/{id}/documents/{docId}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { $ref: '#/components/parameters/DocId' }
    get:
      tags: [RoadsideRequests]
      summary: Download a document attached to the request by the workshop
      responses:
        '200': { description: File content }
        '404': { $ref: '#/components/responses/Error' }
  /admin/roadside-requests:
    get:
      tags: [RoadsideRequests]
      summary: (admin) All assistance requests
      responses:
        '200': { description: OK }
  /admin/roadside-requests/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [RoadsideRequests]
      summary: (admin) A single assistance request
      responses:
        '200': { description: OK }
    patch:
      tags: [RoadsideRequests]
      summary: (admin) Change the state (taken, in progress, completed…), with a note
      responses:
        '200': { description: OK }
        '409': { description: State transition not permitted }

  # ------------------------------------------------------ MobilityRequests
  /mobility-requests:
    get:
      tags: [MobilityRequests]
      summary: Your own mobility requests (replacement car / transport)
      responses:
        '200': { description: OK }
    post:
      tags: [MobilityRequests]
      summary: Create a mobility request
      responses:
        '201': { description: Created }
        '422': { $ref: '#/components/responses/ValidationError' }
  /mobility-requests/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [MobilityRequests]
      summary: O cerere proprie
      responses:
        '200': { description: OK }
        '403': { description: Cererea altui client }
  /mobility-requests/{id}/cancel:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [MobilityRequests]
      summary: Cancel the request
      responses:
        '200': { description: Cancelled }
        '409': { description: Terminal state }
  /admin/mobility-requests:
    get:
      tags: [MobilityRequests]
      summary: (admin) Toate cererile de mobilitate
      responses:
        '200': { description: OK }
  /admin/mobility-requests/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [MobilityRequests]
      summary: (admin) O cerere de mobilitate
      responses:
        '200': { description: OK }
    patch:
      tags: [MobilityRequests]
      summary: (admin) Change the state, with a note
      responses:
        '200': { description: OK }
        '409': { description: State transition not permitted }

  # ---------------------------------------------------------- DamageClaims
  /admin/damage-claims:
    get:
      tags: [DamageClaims]
      summary: (admin) All damage claim files (history)
      description: >
        Clientul NU are API de daune — dosarul se deschide exclusiv pe
        https://amiabila.com/ (the "In case of an accident" link in the app).
      responses:
        '200': { description: OK }
  /admin/damage-claims/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [DamageClaims]
      summary: (admin) A single damage claim file
      responses:
        '200': { description: OK }
    patch:
      tags: [DamageClaims]
      summary: (admin) Change the claim's state, with a note
      responses:
        '200': { description: OK }
        '409': { description: State transition not permitted }
  /admin/damage-claims/{id}/documents/{docId}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { $ref: '#/components/parameters/DocId' }
    get:
      tags: [DamageClaims]
      summary: (admin) Download a document or photo from the claim
      responses:
        '200': { description: File content }
        '404': { $ref: '#/components/responses/Error' }

  # ----------------------------------------------------------------- Taxes
  /taxes:
    get:
      tags: [Taxes]
      summary: Taxele proprii
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TaxItem' } } } } }
    post:
      tags: [Taxes]
      summary: Add a tax (year, type, amount, due date, optional vehicle)
      responses:
        '201': { description: Created }
        '422': { $ref: '#/components/responses/ValidationError' }
  /taxes/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Taxes]
      summary: One of your taxes
      responses:
        '200': { description: OK }
        '403': { description: Taxa altui client }
    patch:
      tags: [Taxes]
      summary: Edit the tax (locked once fully paid; the amount cannot drop below the total paid)
      responses:
        '200': { description: OK }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Taxes]
      summary: Delete the tax (only if not fully paid)
      responses:
        '204': { description: Deleted }
        '422': { description: A paid tax cannot be deleted }
  /taxes/{id}/pay:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [Taxes]
      summary: Mark payment — declarative, NO documents
      description: >
        No body, or `{}`, means payment in full; `{"amount": 200}` records a
        partial, cumulative payment in RON. Invalid amounts return 422 rather
        than being treated as payment in full. An already-paid tax cannot be
        paid again (422).
      responses:
        '200': { description: Payment recorded }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/taxes:
    get:
      tags: [Taxes]
      summary: (admin) All customer taxes
      responses:
        '200': { description: OK }
  /admin/taxes/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Taxes]
      summary: (admin) A single tax
      responses:
        '200': { description: OK }
    patch:
      tags: [Taxes]
      summary: (admin) State correction (for example back to unpaid), with a note
      responses:
        '200': { description: OK }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ------------------------------------------------------------- Documents
  /documents:
    post:
      tags: [Documents]
      summary: Upload a file (multipart, field `file`)
      description: >
        Scanned for malware before becoming servable. Rate limited (P1-04:
        429 + Retry-After on abuse). Used for deadline documents and for
        attachments in messages and quotes — the taxes, assistance and damage
        claim flows have NO file upload.
      responses:
        '201':
          description: Metadate document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentMeta' }
        '422': { description: 'File missing, type not allowed, or too large' }
        '429': { description: Upload rate limit (Retry-After) }
  /documents/{id}/download-url:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Documents]
      summary: A short-lived signed download URL
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  expiresAt: { type: string, format: date-time }
        '404': { $ref: '#/components/responses/Error' }
  /documents/{id}/raw:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Documents]
      summary: File content (using the signature from download-url)
      responses:
        '200': { description: File content }
        '403': { description: Invalid or expired signature }
        '404': { $ref: '#/components/responses/Error' }

  # -------------------------------------------------------------- Settings
  /settings:
    get:
      tags: [Settings]
      summary: Public settings (legal texts, GDPR notice version)
      security: []
      responses:
        '200': { description: OK }
  /admin/settings/{key}:
    parameters: [ { name: key, in: path, required: true, schema: { type: string } } ]
    patch:
      tags: [Settings]
      summary: (admin) Update a configurable setting
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: PHPSESSID
      description: httpOnly session, SameSite=Lax. Admins with 2FA also need /auth/2fa/verify.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: >
        P0-05 — obligatoriu pe POST/PATCH/DELETE (inclusiv login/register):
        valoarea cookie-ului `bcsc_csrf` emis de GET /csrf. Nepotrivire → 403.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    VehicleId:
      name: vehicleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocId:
      name: docId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Error:
      description: Eroare
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationError:
      description: Date invalide
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          # The example values below are Romanian on purpose: they are what the
          # API actually returns. User-facing messages are Romanian and the
          # applications translate them client-side. Do not "fix" them to
          # English — the spec would then document a response that never occurs.
          example:
            type: validation_error
            title: Date invalide
            status: 422
            errors:
              expiresAt: ["Data expirării trebuie să fie ulterioară datei de început."]
            traceId: "01J..."
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, example: validation_error }
        title: { type: string, example: Date invalide }
        status: { type: integer, example: 422 }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        traceId: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    LoginResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { type: string, enum: [CLIENT, SERVICE_ADMIN] }
        requiresOtp: { type: boolean, description: "true = the session is locked until /auth/2fa/verify" }
    RegisterRequest:
      type: object
      required: [email, password, consent]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        firstName: { type: string }
        lastName: { type: string }
        plateNumber:
          type: string
          description: >
            Required ONLY when claiming an imported account: the registration
            plate of a vehicle in the workshop's records (compared without
            spaces, case-insensitively).
        consent: { type: boolean, description: "GDPR consent — must be true" }
    Me:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { type: string, enum: [CLIENT, SERVICE_ADMIN] }
        name: { type: string, nullable: true }
        totpEnabled: { type: boolean }
        requiresOtp: { type: boolean, description: "The session is awaiting the second factor" }
    Vehicle:
      type: object
      properties:
        id: { type: string, format: uuid }
        vin: { type: string }
        plateNumber: { type: string }
        make: { type: string, nullable: true }
        model: { type: string, nullable: true }
        year: { type: integer, nullable: true }
    VehicleInput:
      type: object
      required: [vin, plateNumber]
      properties:
        vin: { type: string, description: "17 caractere, normalizat uppercase; VIN activ unic (409 la duplicat)" }
        plateNumber: { type: string }
        make: { type: string }
        model: { type: string }
        year: { type: integer }
    Deadline:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [ITP, RCA, ROAD_TAX, ROADSIDE_ASSISTANCE] }
        typeLabel: { type: string, description: "Romanian label (translated client-side)" }
        validFrom: { type: string, format: date, nullable: true }
        expiresAt: { type: string, format: date, nullable: true }
        state: { type: string, enum: [UNKNOWN, VALID, DUE_SOON, EXPIRED] }
        stateLabel: { type: string }
        daysLeft: { type: integer, nullable: true, description: "Negative if expired; null if the date is missing" }
        source: { type: string, enum: [CLIENT, SERVICE, IMPORT] }
        verified: { type: boolean, description: "Reset when the customer changes the dates" }
        note: { type: string, nullable: true }
        documents:
          type: array
          items: { $ref: '#/components/schemas/DocumentMeta' }
    DeadlineInput:
      type: object
      required: [type, expiresAt]
      properties:
        type: { type: string, enum: [ITP, RCA, ROAD_TAX, ROADSIDE_ASSISTANCE] }
        validFrom: { type: string, format: date }
        expiresAt: { type: string, format: date }
        note: { type: string }
    ServiceRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        vehicleId: { type: string, format: uuid }
        date: { type: string, format: date, nullable: true }
        workType: { type: string }
        description: { type: string, nullable: true }
        mileage: { type: integer, nullable: true }
        total: { type: number, nullable: true }
        status: { type: string, enum: [DRAFT, PUBLISHED, CORRECTED] }
        correctionReason: { type: string, nullable: true }
        workOrderNumber: { type: string, nullable: true }
        documents:
          type: array
          items: { $ref: '#/components/schemas/DocumentMeta' }
    ServiceRecordInput:
      type: object
      properties:
        date: { type: string, format: date }
        workType: { type: string }
        description: { type: string }
        mileage: { type: integer }
        total: { type: number }
        workOrderNumber: { type: string }
    TaxItem:
      type: object
      description: Declarative records — no attached documents, no receipt.
      properties:
        id: { type: string, format: uuid }
        year: { type: integer }
        type: { type: string, enum: [VEHICLE_TAX, ROAD_TAX, OTHER] }
        typeLabel: { type: string }
        amount: { type: number, description: "RON" }
        paidAmount: { type: number }
        dueDate: { type: string, format: date, nullable: true }
        status: { type: string, enum: [UNPAID, PARTIALLY_PAID, PAID, OVERDUE] }
        statusLabel: { type: string }
        vehicleId: { type: string, format: uuid, nullable: true }
        note: { type: string, nullable: true }
    DocumentMeta:
      type: object
      properties:
        id: { type: string, format: uuid }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        scanStatus: { type: string, enum: [PENDING, CLEAN, INFECTED] }

security:
  - sessionCookie: []
  - csrfToken: []
