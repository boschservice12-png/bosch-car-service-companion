# Compose de PRODUCȚIE pentru pilot — stivă completă, neutră față de hosting.
# Rulare:
#   cp .env.prod.example .env.prod   # completați secretele!
#   docker compose --env-file .env.prod -f compose.prod.yaml up -d --build
#
# Frontendurile sunt BUILD-uite (next build + next start), storage-ul e S3/MinIO,
# scanarea antimalware e ClamAv (activă în APP_ENV=prod), iar Caddy termină TLS.
# Vezi docs/DEPLOY_PILOT.md pentru procedura completă.
name: bcsc-prod

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bcsc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?setați POSTGRES_PASSWORD în .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-bcsc}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bcsc} -d ${POSTGRES_DB:-bcsc}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  minio:
    # Fixat pe versiunea rulată și verificată în producție (2026-08-11).
    # `minio/minio` fără etichetă înseamnă `:latest` — exact capcana din §7 a
    # CLAUDE.md, care a spart deja o dată build-ul backendului (php:8-fpm ->
    # PHP 8.5). Pentru stocarea documentelor clienților, un upgrade neplanificat
    # de server de obiecte nu e ceva ce vrei să descoperi la un restart.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?setați MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?setați MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data

  # Creează bucketul privat o singură dată, apoi iese. Backend-ul așteaptă
  # finalizarea lui cu succes înainte de pornire.
  minio-setup:
    # Fixat, din același motiv ca serverul MinIO de mai sus. Aceeași versiune e
    # folosită și în infrastructure/backup/Dockerfile — schimbați-le împreună.
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-bcsc-documents}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do echo 'aștept minio…'; sleep 2; done;
      mc mb -p local/$$S3_BUCKET || true;
      mc anonymous set none local/$$S3_BUCKET;
      echo 'bucket pregătit (privat).'
      "

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamavdata:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--version"]
      interval: 30s
      timeout: 10s
      retries: 10

  # Migrații — serviciu ONE-SHOT, proprietarul unic al schemei. Rulează, iese cu 0,
  # iar `backend` și `worker` pornesc abia după aceea. Bariera trebuie să fie
  # explicită: `service_started` pe backend se declanșa la pornirea containerului,
  # nu după terminarea migrațiilor, ceea ce lăsa workerul să concureze pe crearea
  # tabelei `messenger_messages`. Folosește imaginea construită de `backend`.
  migrate:
    image: ${BCSS_REGISTRY:-ghcr.io/boschservice12-png}/bcsc-backend:${IMAGE_TAG:-latest}
    restart: "no"
    env_file: [.env.prod]
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
    volumes:
      - ./infrastructure/docker/migrate-entrypoint.sh:/usr/local/bin/migrate-entrypoint.sh:ro
    entrypoint: ["sh", "/usr/local/bin/migrate-entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy

  # Backend PHP-FPM. NU rulează migrații (vezi serviciul `migrate`) — doar
  # încălzește cache-ul și servește prin FastCGI către nginx-ul `api`.
  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/backend.Dockerfile
    image: ${BCSS_REGISTRY:-ghcr.io/boschservice12-png}/bcsc-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env.prod]
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
    volumes:
      - ./infrastructure/docker/backend-entrypoint.sh:/usr/local/bin/backend-entrypoint.sh:ro
    entrypoint: ["sh", "/usr/local/bin/backend-entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-setup:
        condition: service_completed_successfully

  # Nginx pentru backend (FastCGI). Punctul de intrare intern al API-ului: `http://api`.
  api:
    image: nginx:1.27
    restart: unless-stopped
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  # Worker Messenger: scanare antimalware documente + notificări. NU rulează
  # migrații. Restart automat la time-limit/eroare.
  #
  # Depinde de `migrate`, nu de `backend`: workerul are nevoie de SCHEMĂ, nu de
  # php-fpm. Așa pornește în paralel cu backend-ul, dar niciodată înaintea
  # migrațiilor.
  worker:
    image: ${BCSS_REGISTRY:-ghcr.io/boschservice12-png}/bcsc-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env.prod]
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=256M", "-vv"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  customer-web:
    build:
      context: ./apps/customer-web
      dockerfile: ../../infrastructure/docker/frontend.Dockerfile
    image: ${BCSS_REGISTRY:-ghcr.io/boschservice12-png}/bcsc-customer-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE: "http://api"
    command: ["npx", "next", "start", "-H", "0.0.0.0", "-p", "3000"]
    depends_on:
      - api

  service-admin:
    build:
      context: ./apps/service-admin
      dockerfile: ../../infrastructure/docker/frontend.Dockerfile
    image: ${BCSS_REGISTRY:-ghcr.io/boschservice12-png}/bcsc-service-admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE: "http://api"
    command: ["npx", "next", "start", "-H", "0.0.0.0", "-p", "3001"]
    depends_on:
      - api

  # Backup automat zilnic: pg_dump + oglindirea bucketului MinIO (mc mirror),
  # cu verificare de integritate și retenție. Mentiunea în docs/DEPLOY_PILOT.md.
  backup:
    build:
      context: ./infrastructure/backup
      dockerfile: Dockerfile
    image: ${BCSS_REGISTRY:-ghcr.io/boschservice12-png}/bcsc-backup:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env.prod]
    environment:
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: "14"
      BACKUP_HOUR: "3"
      BACKUP_RUN_ON_START: "0"
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started

  # Sarcini periodice ale aplicației (azi: `app:gdpr:purge`). Rulează pe imaginea
  # backend-ului, pentru că are nevoie de `bin/console`. Depinde de `migrate`:
  # purjarea scrie în schemă, deci nu are ce căuta înaintea migrațiilor.
  scheduler:
    image: ${BCSS_REGISTRY:-ghcr.io/boschservice12-png}/bcsc-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env.prod]
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      # Deliberat DUPĂ ora backupului (3): întâi salvăm, apoi ștergem ireversibil.
      GDPR_PURGE_HOUR: "4"
    volumes:
      - ./infrastructure/docker/scheduler-entrypoint.sh:/usr/local/bin/scheduler-entrypoint.sh:ro
    entrypoint: ["sh", "/usr/local/bin/scheduler-entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Proxy de margine + TLS. Cu domeniu → Let's Encrypt automat pe 443.
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      CUSTOMER_SITE: ${CUSTOMER_SITE:-:80}
      ADMIN_SITE: ${ADMIN_SITE:-:8081}
    ports:
      - "80:80"
      - "443:443"
      # 8081 NU se mai publică. Era rămășița configurației fără domeniu, în care
      # adminul se servea pe `http://<IP>:8081`. Pilotul rulează pe domenii cu
      # TLS (admin.app.bcss.ro), firewallul blochează oricum portul, deci era
      # doar suprafață moartă. Dacă reveniți vreodată la varianta fără domeniu,
      # adăugați aici `- "8081:8081"` odată cu ADMIN_SITE=:8081.
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - customer-web
      - service-admin

volumes:
  pgdata:
  redisdata:
  miniodata:
  clamavdata:
  caddydata:
  caddyconfig:
  backups:
