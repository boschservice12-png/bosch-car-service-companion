# PRODUCTION compose for the pilot — the complete stack, hosting-neutral.
#
# Run:
#   cp .env.prod.example .env.prod   # fill in the secrets!
#   docker compose --env-file .env.prod -f compose.prod.yaml up -d
#
# The frontends are BUILT (next build + next start), storage is S3/MinIO,
# antimalware scanning is ClamAV (active when APP_ENV=prod), and Caddy
# terminates TLS. See docs/DEPLOYMENT.md for the full procedure.
#
# Images are normally pulled from GHCR by the deploy pipeline rather than built
# here; the `build:` sections exist for local work and emergencies. Never build
# on the production box — see docs/DEPLOYMENT.md.
name: bcsc-prod

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bcsc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-bcsc}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bcsc} -d ${POSTGRES_DB:-bcsc}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  minio:
    # Pinned to the release running and verified in production (2026-08-11).
    # `minio/minio` without a tag means `:latest` — exactly the trap described in
    # docs/TROUBLESHOOTING.md, which already broke the backend build once
    # (php:8-fpm drifting to PHP 8.5). For the object store holding customer
    # documents, an unplanned upgrade is not something to discover at a restart.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data

  # Creates the private bucket once, then exits. The backend waits for it to
  # complete successfully before starting.
  minio-setup:
    # Pinned for the same reason as the MinIO server above. The same version is
    # used in infrastructure/backup/Dockerfile — change them together.
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-bcsc-documents}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do echo 'waiting for minio…'; sleep 2; done;
      mc mb -p local/$$S3_BUCKET || true;
      mc anonymous set none local/$$S3_BUCKET;
      echo 'bucket ready (private).'
      "

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamavdata:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--version"]
      interval: 30s
      timeout: 10s
      retries: 10

  # Migrations — a ONE-SHOT service and the single owner of the schema. It runs,
  # exits 0, and only then do `backend` and `worker` start. The barrier has to be
  # explicit: `service_started` on the backend fired the moment the container
  # started, not when migrations finished, which let the worker race the creation
  # of the `messenger_messages` table. Uses the image built by `backend`.
  migrate:
    image: ${BCSS_REGISTRY:-ghcr.io/boschservice12-png}/bcsc-backend:${IMAGE_TAG:-latest}
    restart: "no"
    env_file: [.env.prod]
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
    volumes:
      - ./infrastructure/docker/migrate-entrypoint.sh:/usr/local/bin/migrate-entrypoint.sh:ro
    entrypoint: ["sh", "/usr/local/bin/migrate-entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy

  # PHP-FPM backend. It does NOT run migrations (see the `migrate` service) —
  # it only warms the cache and serves over FastCGI to the `api` nginx.
  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/backend.Dockerfile
    image: ${BCSS_REGISTRY:-ghcr.io/boschservice12-png}/bcsc-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env.prod]
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
    volumes:
      - ./infrastructure/docker/backend-entrypoint.sh:/usr/local/bin/backend-entrypoint.sh:ro
    entrypoint: ["sh", "/usr/local/bin/backend-entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-setup:
        condition: service_completed_successfully

  # Nginx in front of the backend (FastCGI). The API's internal entry point:
  # `http://api`. Its config must re-resolve the backend hostname at runtime —
  # see infrastructure/nginx/default.conf for why.
  api:
    image: nginx:1.27
    restart: unless-stopped
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  # Messenger worker: document antimalware scanning + notifications. Does NOT
  # run migrations. Restarts automatically on time-limit or error.
  #
  # It depends on `migrate`, not on `backend`: the worker needs the SCHEMA, not
  # php-fpm. That way it starts in parallel with the backend, but never before
  # the migrations.
  worker:
    image: ${BCSS_REGISTRY:-ghcr.io/boschservice12-png}/bcsc-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env.prod]
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=256M", "-vv"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  customer-web:
    build:
      context: ./apps/customer-web
      dockerfile: ../../infrastructure/docker/frontend.Dockerfile
    image: ${BCSS_REGISTRY:-ghcr.io/boschservice12-png}/bcsc-customer-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE: "http://api"
    command: ["npx", "next", "start", "-H", "0.0.0.0", "-p", "3000"]
    depends_on:
      - api

  service-admin:
    build:
      context: ./apps/service-admin
      dockerfile: ../../infrastructure/docker/frontend.Dockerfile
    image: ${BCSS_REGISTRY:-ghcr.io/boschservice12-png}/bcsc-service-admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE: "http://api"
    command: ["npx", "next", "start", "-H", "0.0.0.0", "-p", "3001"]
    depends_on:
      - api

  # Automatic daily backup: pg_dump + mirroring the MinIO bucket (mc mirror),
  # with integrity checks, an off-box copy and retention.
  # See docs/BACKUP_AND_RESTORE.md.
  backup:
    build:
      context: ./infrastructure/backup
      dockerfile: Dockerfile
    image: ${BCSS_REGISTRY:-ghcr.io/boschservice12-png}/bcsc-backup:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env.prod]
    environment:
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: "14"
      BACKUP_HOUR: "3"
      BACKUP_RUN_ON_START: "0"
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started

  # The application's periodic tasks (today: `app:gdpr:purge`). Runs on the
  # backend image because it needs `bin/console`. Depends on `migrate`: the
  # purge writes to the schema, so it has no business running before migrations.
  scheduler:
    image: ${BCSS_REGISTRY:-ghcr.io/boschservice12-png}/bcsc-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env.prod]
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      # Deliberately AFTER the backup hour (3): save first, then delete
      # irreversibly.
      GDPR_PURGE_HOUR: "4"
    volumes:
      - ./infrastructure/docker/scheduler-entrypoint.sh:/usr/local/bin/scheduler-entrypoint.sh:ro
    entrypoint: ["sh", "/usr/local/bin/scheduler-entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Edge proxy + TLS. With domains configured, Caddy provisions Let's Encrypt
  # certificates automatically on 443.
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      CUSTOMER_SITE: ${CUSTOMER_SITE:-:80}
      ADMIN_SITE: ${ADMIN_SITE:-:8081}
    ports:
      - "80:80"
      - "443:443"
      # 8081 is no longer published. It was a leftover of the no-domain setup,
      # where the admin portal was served on `http://<IP>:8081`. The pilot runs
      # on domains with TLS (admin.app.bcss.ro) and the firewall blocked the
      # port anyway, so it was dead surface. If you ever go back to the
      # no-domain variant, add `- "8081:8081"` here together with ADMIN_SITE=:8081.
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - customer-web
      - service-admin

volumes:
  pgdata:
  redisdata:
  miniodata:
  clamavdata:
  caddydata:
  caddyconfig:
  backups:
