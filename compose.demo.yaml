# One-command demo — the whole stack (database + backend + both frontends).
# Run:    docker compose -f compose.demo.yaml up --build
# Then:   Customer  http://localhost:3000   ·   Admin http://localhost:3001
# Logins: admin@bcsc.ro / client@bcsc.ro    (password Demo1234!)
#
# This is a DEVELOPMENT stack: APP_ENV=dev, local disk storage, no antimalware
# scanning, no TLS. Production is compose.prod.yaml — see docs/DEPLOYMENT.md.
name: bcsc-demo

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bcsc
      POSTGRES_PASSWORD: bcsc
      POSTGRES_DB: bcsc
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bcsc -d bcsc"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Symfony backend: runs migrations and the demo seed at start-up, then serves
  # on :8080.
  backend:
    build:
      context: .
      dockerfile: demo/backend.Dockerfile
    image: bcsc-demo-backend
    environment:
      APP_ENV: dev
      APP_DEBUG: "0"
      DATABASE_URL: "postgresql://bcsc:bcsc@db:5432/bcsc?serverVersion=16&charset=utf8"
      MESSENGER_TRANSPORT_DSN: "doctrine://default?auto_setup=1"
      CORS_ALLOW_ORIGIN: "http://localhost:3000,http://localhost:3001"
      STORAGE_DRIVER: "local"
    # Uploaded and scanned documents live on a PERSISTENT volume, not in the
    # container's ephemeral layer — they survive `up --build` and restarts.
    volumes:
      - storage_data:/app/var/storage
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  # Messenger worker: consumes the "async" transport (antimalware document
  # scanning, notifications). Without it, documents would stay PENDING forever.
  # Uses the SAME image as the backend (built by the `backend` service) but with
  # a dedicated entrypoint. Automatic restart: on --time-limit or error the
  # process exits and compose restarts it — it never "dies quietly". A SINGLE
  # worker in the demo — we do not scale here.
  worker:
    image: bcsc-demo-backend
    command: ["/usr/local/bin/worker-entrypoint.sh"]
    environment:
      APP_ENV: dev
      APP_DEBUG: "0"
      DATABASE_URL: "postgresql://bcsc:bcsc@db:5432/bcsc?serverVersion=16&charset=utf8"
      MESSENGER_TRANSPORT_DSN: "doctrine://default?auto_setup=1"
      STORAGE_DRIVER: "local"
    restart: unless-stopped
    # The worker writes scanned documents to the SAME volume as the backend,
    # otherwise files produced by scanning would not be visible for download.
    volumes:
      - storage_data:/app/var/storage
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

  # Customer frontend (PWA). Proxies /api -> http://backend:8080 server-side,
  # via the rewrite in next.config.
  customer-web:
    image: node:20-bookworm-slim
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npx next dev -H 0.0.0.0 -p 3000"
    environment:
      NEXT_PUBLIC_API_BASE: "http://backend:8080"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./apps/customer-web:/app
      - cw_node_modules:/app/node_modules
      - cw_next:/app/.next
    depends_on:
      - backend
    ports:
      - "3000:3000"

  # Admin frontend (service portal).
  service-admin:
    image: node:20-bookworm-slim
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npx next dev -H 0.0.0.0 -p 3001"
    environment:
      NEXT_PUBLIC_API_BASE: "http://backend:8080"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./apps/service-admin:/app
      - sa_node_modules:/app/node_modules
      - sa_next:/app/.next
    depends_on:
      - backend
    ports:
      - "3001:3001"

volumes:
  db_data:
  storage_data:
  cw_node_modules:
  cw_next:
  sa_node_modules:
  sa_next:
