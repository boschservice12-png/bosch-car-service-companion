<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a2540">
  <title>Fără conexiune — Companion</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #f4f6f9; color: #0a2540; font-family: system-ui, -apple-system, sans-serif; }
    .card { background: #fff; border-radius: 14px; box-shadow: 0 2px 12px rgba(10,37,64,.08);
            padding: 28px 22px; margin: 16px; max-width: 420px; text-align: center; }
    img { width: 64px; height: 64px; border-radius: 14px; }
    h1 { font-size: 1.15rem; margin: 14px 0 8px; }
    p { color: #5b6b7c; font-size: .95rem; line-height: 1.5; margin: 0 0 18px; }
    button { min-height: 44px; padding: 12px 22px; border: 0; border-radius: 10px; cursor: pointer;
             background: #0a2540; color: #fff; font-size: 1rem; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="">
    <h1>Nu există conexiune la internet.</h1>
    <p>Datele actuale ale vehiculului necesită conexiune la internet.<br>Verifică conexiunea și încearcă din nou.</p>
    <button onclick="location.reload()">Încearcă din nou</button>
  </div>
</body>
</html>
