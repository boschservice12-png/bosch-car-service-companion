parameters:
    app.timezone: '%env(APP_TIMEZONE)%'
    app.cors_allow_origin: '%env(CORS_ALLOW_ORIGIN)%'
    app.storage_dir: '%kernel.project_dir%/var/storage'
    # P0-06: in production, admin accounts without 2FA cannot use /api/admin
    # (see when@prod below + TwoFactorGuardListener).
    admin_2fa_enforce_enrollment: false
    # P0-05: default value when the environment variable is absent.
    env(CSRF_TRUSTED_ORIGINS): ''

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/**/Domain/'          # entities + value objects (not services)
            - '../src/**/Presentation/Dto/' # request DTOs
            - '../src/**/Application/Message/' # Messenger messages

    # ---- Domain contracts -> Infrastructure implementations ----
    App\Vehicle\Domain\VehicleRepository:
        alias: App\Vehicle\Infrastructure\DoctrineVehicleRepository

    App\Vehicle\Domain\VehicleActivationTokenRepository:
        alias: App\Vehicle\Infrastructure\DoctrineVehicleActivationTokenRepository

    App\Document\Domain\DocumentRepository:
        alias: App\Document\Infrastructure\DoctrineDocumentRepository

    App\Deadline\Domain\VehicleDeadlineRepository:
        alias: App\Deadline\Infrastructure\DoctrineVehicleDeadlineRepository

    App\ServiceHistory\Domain\ServiceRecordRepository:
        alias: App\ServiceHistory\Infrastructure\DoctrineServiceRecordRepository

    App\Communication\Domain\ConversationRepository:
        alias: App\Communication\Infrastructure\DoctrineConversationRepository

    App\Roadside\Domain\RoadsideRequestRepository:
        alias: App\Roadside\Infrastructure\DoctrineRoadsideRequestRepository

    App\Mobility\Domain\MobilityRequestRepository:
        alias: App\Mobility\Infrastructure\DoctrineMobilityRequestRepository

    App\DamageClaim\Domain\DamageClaimRepository:
        alias: App\DamageClaim\Infrastructure\DoctrineDamageClaimRepository

    App\Tax\Domain\TaxItemRepository:
        alias: App\Tax\Infrastructure\DoctrineTaxItemRepository

    App\QuoteRequest\Domain\QuoteRequestRepository:
        alias: App\QuoteRequest\Infrastructure\DoctrineQuoteRequestRepository

    App\Notification\Domain\NotificationRepository:
        alias: App\Notification\Infrastructure\DoctrineNotificationRepository

    # Notification delivery: the pilot has NO automated provider (no mailer, no
    # push, no paid WhatsApp API) -> MANUAL_ACTION_REQUIRED / SKIPPED, never a
    # blind SENT. Replace with a real provider once one is configured. This is
    # the single largest gap before real users — see the README.
    App\Notification\Domain\NotificationDelivery:
        alias: App\Notification\Infrastructure\ManualNotificationDelivery

    # Status calculator — a dependency-free value object living in Domain/
    # (excluded from auto-registration), so we declare it explicitly.
    App\Deadline\Domain\DeadlineStatusCalculator: ~

    # ---- Private document storage (local in dev/demo; S3/MinIO in prod) ----
    # Switched at runtime via STORAGE_DRIVER=local|s3. Both implementations are
    # always constructible; the factory picks one on demand.
    App\Document\Infrastructure\LocalFilesystemStorage:
        arguments:
            $rootDir: '%app.storage_dir%'
    App\Document\Infrastructure\S3Storage:
        arguments:
            $endpoint: '%env(S3_ENDPOINT)%'
            $bucket: '%env(S3_BUCKET)%'
            $accessKey: '%env(S3_KEY)%'
            $secretKey: '%env(S3_SECRET)%'
            $region: '%env(S3_REGION)%'
    App\Document\Infrastructure\StorageFactory:
        arguments:
            $driver: '%env(STORAGE_DRIVER)%'
    App\Document\Domain\StorageAdapter:
        factory: ['@App\Document\Infrastructure\StorageFactory', 'create']

    # ---- Readiness: deep verification of the critical dependencies ----
    App\System\Application\ReadinessChecker:
        arguments:
            $migrations: '@doctrine.migrations.dependency_factory'
            $appSecret: '%env(APP_SECRET)%'

    # ---- Antimalware scanner: dev = permissive (marks CLEAN + warns) ----
    # ClamAvScanner is always constructible (scalar arguments) but only becomes
    # the active implementation in production (see when@prod below).
    App\Document\Infrastructure\ClamAvScanner:
        arguments:
            $host: '%env(CLAMAV_HOST)%'
            $port: '%env(int:CLAMAV_PORT)%'
    App\Document\Domain\MalwareScanner:
        alias: App\Document\Infrastructure\PermissiveDevScanner

    # ---- Signed, time-limited URLs ----
    App\Document\Application\SignedUrlGenerator:
        arguments:
            $secret: '%env(APP_SECRET)%'

    # ---- Cross-cutting listeners ----
    App\Shared\Presentation\CorsListener:
        arguments:
            $allowedOrigins: '%app.cors_allow_origin%'
        tags:
            - { name: kernel.event_listener, event: kernel.request, method: onRequest, priority: 250 }
            - { name: kernel.event_listener, event: kernel.response, method: onResponse }

    App\Shared\Presentation\ApiExceptionListener:
        tags:
            - { name: kernel.event_listener, event: kernel.exception, method: onKernelException }

    # P0-05: optional origin allowlist for state-changing requests.
    App\Shared\Security\CsrfProtectionSubscriber:
        arguments:
            $trustedOrigins: '%env(CSRF_TRUSTED_ORIGINS)%'

# In production: ClamAV (fail-closed) + mandatory 2FA enrolment for admins.
when@prod:
    parameters:
        admin_2fa_enforce_enrollment: true

    services:
        App\Document\Domain\MalwareScanner:
            alias: App\Document\Infrastructure\ClamAvScanner
