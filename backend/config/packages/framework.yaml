framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    handle_all_throwables: true

    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        cookie_httponly: true
        # PWA: clientul rămâne autentificat 30 de zile (cookie + gc pe server);
        # logout-ul invalidează sesiunea imediat (P1-06/P0-07 rămân valabile).
        cookie_lifetime: 2592000
        gc_maxlifetime: 2592000
        storage_factory_id: session.storage.factory.native

    php_errors:
        log: true

    rate_limiter:
        login:
            policy: sliding_window
            limit: 5
            interval: '1 minute'
        messages:
            policy: sliding_window
            limit: 20
            interval: '1 minute'
        upload:
            policy: sliding_window
            limit: 30
            interval: '1 minute'
        # Înregistrarea poartă dovada revendicării (numărul de înmatriculare) —
        # fără limită ar putea fi ghicit prin forță brută. Cheia e emailul țintă.
        register:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        # Codurile TOTP au doar 6 cifre — fără limită ar putea fi ghicite.
        # La reușită contorul se resetează (utilizatorul legitim nu acumulează).
        twofa:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        # Activarea vehiculului cu cod — anti forță-brută pe cod (per utilizator + IP).
        activation:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'

when@test:
    framework:
        test: true
        rate_limiter:
            login: { policy: sliding_window, limit: 5, interval: '1 minute' }
            messages: { policy: sliding_window, limit: 10, interval: '1 minute' }
            upload: { policy: sliding_window, limit: 10, interval: '1 minute' }
            register: { policy: sliding_window, limit: 5, interval: '1 minute' }
            twofa: { policy: sliding_window, limit: 5, interval: '1 minute' }
            activation: { policy: sliding_window, limit: 5, interval: '1 minute' }
        session:
            storage_factory_id: session.storage.factory.mock_file
