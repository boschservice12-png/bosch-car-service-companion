framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    handle_all_throwables: true

    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        cookie_httponly: true
        storage_factory_id: session.storage.factory.native

    php_errors:
        log: true

    rate_limiter:
        login:
            policy: sliding_window
            limit: 5
            interval: '1 minute'
        messages:
            policy: sliding_window
            limit: 20
            interval: '1 minute'
        upload:
            policy: sliding_window
            limit: 30
            interval: '1 minute'

when@test:
    framework:
        test: true
        rate_limiter:
            login: { policy: sliding_window, limit: 5, interval: '1 minute' }
            messages: { policy: sliding_window, limit: 10, interval: '1 minute' }
            upload: { policy: sliding_window, limit: 10, interval: '1 minute' }
        session:
            storage_factory_id: session.storage.factory.mock_file
