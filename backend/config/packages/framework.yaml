framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    handle_all_throwables: true

    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        cookie_httponly: true
        # PWA: the customer stays authenticated for 30 days (cookie + server-side
        # gc); logout invalidates the session immediately, and disabled accounts
        # lose access immediately (P0-07).
        cookie_lifetime: 2592000
        gc_maxlifetime: 2592000
        storage_factory_id: session.storage.factory.native

    php_errors:
        log: true

    rate_limiter:
        login:
            policy: sliding_window
            limit: 5
            interval: '1 minute'
        messages:
            policy: sliding_window
            limit: 20
            interval: '1 minute'
        upload:
            policy: sliding_window
            limit: 30
            interval: '1 minute'
        # Registration carries the claim evidence (the registration plate) —
        # without a limit it could be brute-forced. The key is the target email.
        register:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        # TOTP codes are only 6 digits — without a limit they could be guessed.
        # The counter resets on success, so a legitimate user does not accumulate.
        twofa:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        # Vehicle activation by code — anti brute-force on the code (per user + IP).
        activation:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'

when@test:
    framework:
        test: true
        rate_limiter:
            login: { policy: sliding_window, limit: 5, interval: '1 minute' }
            messages: { policy: sliding_window, limit: 10, interval: '1 minute' }
            upload: { policy: sliding_window, limit: 10, interval: '1 minute' }
            register: { policy: sliding_window, limit: 5, interval: '1 minute' }
            twofa: { policy: sliding_window, limit: 5, interval: '1 minute' }
            activation: { policy: sliding_window, limit: 5, interval: '1 minute' }
        session:
            storage_factory_id: session.storage.factory.mock_file
