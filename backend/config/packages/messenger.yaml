framework:
    messenger:
        failure_transport: failed
        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
        routing:
            # Notifications and background jobs -> async
            App\Notification\Application\Message\SendNotification: async
            App\Document\Application\Message\ScanDocument: async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
